[build]
command = "pnpm run build"
publish = "build/"

# The hashed files under /_app/immutable/ never change, so browsers may keep them for a
# year. adapter-netlify wrote this rule itself; adapter-static leaves it to us.
[[headers]]
for = "/_app/immutable/*"
[headers.values]
cache-control = "public, immutable, max-age=31536000"
