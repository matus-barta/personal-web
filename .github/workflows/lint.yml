name: Lint check
on:
  pull_request:
    branches: [main, master]
  push:
    branches: ['renovate/**']
permissions:
  contents: read
  # needed by the failure comment below; note it is read-only on fork PRs regardless
  pull-requests: write
# A new push replaces the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: ./pnpm-lock.yaml
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Run lint
        id: lint
        run: pnpm run lint

      # Also when lint failed, so type errors are not hidden behind formatting ones.
      - name: Run type check
        if: success() || steps.lint.outcome == 'failure'
        run: pnpm run check

      - name: Comment on how to fix lint issue
        if: (github.event_name == 'pull_request') && (failure() && steps.lint.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '‼️ Please run `pnpm format` on your PR! Thank you. ‼️'
            })
