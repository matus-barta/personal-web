name: Playwright Tests
on:
  push:
    branches: [main, master, 'renovate/**']
    # Docs and agent files only; never '**.md', which would skip the posts in content/blog/.
    paths-ignore: &docs
      - '.agents/**'
      - '.claude/**'
      - 'LICENSE'
      - 'README.md'
      - 'THIRD-PARTY-NOTICES.md'
      - 'skills-lock.json'
  pull_request:
    branches: [main, master]
    paths-ignore: *docs
permissions:
  contents: read
# A new push replaces the run it supersedes, except on master, where every commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  playwright-tests:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: ./pnpm-lock.yaml
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # The browsers run in Playwright's image, started by scripts/with-browsers.ts.
      # Each Playwright version has its own image, so the version is the cache key.
      - name: Cache Playwright image
        id: cache-playwright-image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/playwright-image.tar
          key: playwright-image-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Load Playwright image
        if: steps.cache-playwright-image.outputs.cache-hit == 'true'
        run: docker load --input ~/playwright-image.tar

      # The same image name scripts/with-browsers.ts derives from the installed version.
      - name: Pull Playwright image
        if: steps.cache-playwright-image.outputs.cache-hit != 'true'
        env:
          IMAGE: mcr.microsoft.com/playwright:v${{ steps.playwright-version.outputs.version }}-noble
        run: |
          docker pull "$IMAGE"
          docker save --output ~/playwright-image.tar "$IMAGE"

      - name: Build website
        run: pnpm run build

      - name: Run Playwright tests
        run: pnpm run test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
